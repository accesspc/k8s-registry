---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      containers:
        - image: registry:latest
          name: registry
          env:
            - name: REGISTRY_LOG_LEVEL
              value: info
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            periodSeconds: 15
          ports:
            - containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            # limits:
            #   cpu: 1000m
            #   memory: 250Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 998
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /var/lib/registry
              name: data
      serviceAccount: {{ .Release.Name }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry
